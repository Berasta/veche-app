[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Профили оптимизации
[profile.dev]
incremental = true  # Инкрементальная компиляция для dev сборок

[profile.release]
# Быстрая сборка с умеренной оптимизацией
codegen-units = 1     # Лучшая оптимизация, но медленнее компиляция
lto = false           # Отключаем LTO для быстрой сборки
opt-level = 2         # Умеренная оптимизация (вместо 3)
strip = true          # Удаляем отладочные символы

# Оптимизируем зависимости отдельно
[profile.release.package."*"]
opt-level = 2         # Умеренная оптимизация для зависимостей
strip = true

# Профиль для финальных релизов (максимальная оптимизация)
[profile.release-optimized]
inherits = "release"
codegen-units = 1
lto = "thin"          # Включаем thin LTO
opt-level = "z"       # Оптимизация по размеру
strip = true
panic = "abort"       # Меньший размер бинарника

