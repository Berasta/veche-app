<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a120c"/>
      <stop offset="100%" stop-color="#2d2117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e8c56a"/>
    </linearGradient>
    <linearGradient id="bell" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#c1702a"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#gold)" stroke-width="8"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <!-- Decorative top arcs -->
  <path d="M156 180 Q256 120 356 180" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.5"/>
  <path d="M176 160 Q256 110 336 160" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <!-- Bell body -->
  <path d="M216 200 L216 280 Q216 310 200 320 L312 320 Q296 310 296 280 L296 200 Z" fill="url(#bell)" opacity="0.9"/>
  <!-- Bell top knob -->
  <circle cx="256" cy="190" r="10" fill="url(#gold)"/>
  <!-- Bell clapper -->
  <circle cx="256" cy="330" r="8" fill="#c1702a"/>
  <!-- Bell bottom rim -->
  <rect x="194" y="316" width="124" height="6" rx="3" fill="url(#gold)"/>
  <!-- Decorative band -->
  <rect x="216" y="240" width="80" height="3" rx="1.5" fill="#e8c56a" opacity="0.6"/>
  <rect x="216" y="260" width="80" height="3" rx="1.5" fill="#e8c56a" opacity="0.6"/>
  <!-- Ornamental side lines -->
  <path d="M140 280 Q130 256 140 232" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <path d="M372 280 Q382 256 372 232" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <!-- Small decorative dots -->
  <circle cx="140" cy="256" r="3" fill="url(#gold)" opacity="0.5"/>
  <circle cx="372" cy="256" r="3" fill="url(#gold)" opacity="0.5"/>
</svg>
