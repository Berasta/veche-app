name: Build Tauri Desktop App

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Build Tauri app
        env:
          VITE_PB_URL: https://admin.weche.ru
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tauri build

      - name: List release directory
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/ | Select-Object FullName | Select-Object -First 100

      - name: Copy installer to root
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Recurse src-tauri/target/release/bundle/*.exe `
            | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem -Recurse src-tauri/target/release/bundle/*.msi | Select-Object -First 1 }
          if ($installer) { Copy-Item $installer.FullName ./veche-installer.exe }
          else { throw "No installer found in bundle" }

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: veche-windows
          path: veche-installer.exe
          if-no-files-found: error

  nightly:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: veche-windows

      - name: Update Nightly Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "veche-installer.exe"
          tag: "nightly"
          name: "Последняя сборка"
          body: |
            Автоматическая сборка из main.

            ### Установка
            - **Windows**: скачай `veche-installer.exe` и запусти
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: veche-windows

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "veche-installer.exe"
          tag: ${{ github.ref_name }}
          name: "Вече ${{ github.ref_name }}"
          body: |
            ## Вече ${{ github.ref_name }}

            ### Установка
            - **Windows**: скачай `veche-installer.exe` и запусти
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
