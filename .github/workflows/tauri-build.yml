name: Build Tauri Desktop App

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Build Tauri app
        env:
          VITE_PB_URL: https://admin.weche.ru
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: veche-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload to Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "src-tauri/target/release/bundle/nsis/*.exe"
          tag: "nightly"
          name: "Последняя сборка"
          body: "Автоматическая сборка из main"
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: veche-windows

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.exe"
          tag: ${{ github.ref_name }}
          name: "Вече ${{ github.ref_name }}"
          body: |
            ## Вече ${{ github.ref_name }}

            ### Установка
            - **Windows**: скачай `setup.exe` и запусти
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
