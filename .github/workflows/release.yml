name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например: 0.3.1)'
        required: true
        type: string

jobs:
  build-tauri:
    permissions:
      contents: write  # Для создания релизов
    
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Вече ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.sig
          retention-days: 5

  # Генерация releases.json после сборки всех платформ
  generate-releases-json:
    needs: build-tauri
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate releases.json
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"  # Убираем 'v' из тега
          
          # Создаем структуру
          mkdir -p updates/releases
          
          # Копируем все артефакты
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.sig" \) -exec cp {} updates/releases/ \;
          
          # Генерируем releases.json
          cat > generate-releases.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const version = process.env.VERSION;
          const releasesDir = 'updates/releases';
          const files = fs.readdirSync(releasesDir);
          
          const platforms = {};
          
          // Группируем файлы по платформам
          files.forEach(file => {
            if (file.endsWith('.sig')) return;
            
            let platform = '';
            if (file.includes('aarch64') && file.endsWith('.dmg')) {
              platform = 'darwin-aarch64';
            } else if (file.endsWith('.dmg')) {
              platform = 'darwin-x86_64';
            } else if (file.endsWith('.msi') || file.endsWith('-setup.exe')) {
              platform = 'windows-x86_64';
            } else if (file.endsWith('.AppImage')) {
              platform = 'linux-x86_64';
            }
            
            if (platform) {
              const sigFile = file + '.sig';
              const sigPath = path.join(releasesDir, sigFile);
              
              if (fs.existsSync(sigPath)) {
                const signature = fs.readFileSync(sigPath, 'utf-8').trim();
                platforms[platform] = {
                  signature,
                  url: `https://updates.weche.ru/releases/${file}`
                };
              }
            }
          });
          
          const release = {
            version,
            notes: `Обновление до версии ${version}`,
            pub_date: new Date().toISOString(),
            platforms
          };
          
          // Читаем существующий файл или создаем новый
          let releases = [];
          const jsonPath = 'updates/releases.json';
          
          if (fs.existsSync(jsonPath)) {
            releases = JSON.parse(fs.readFileSync(jsonPath, 'utf-8'));
          }
          
          // Добавляем новый релиз в начало
          releases.unshift(release);
          
          // Сохраняем
          fs.writeFileSync(jsonPath, JSON.stringify(releases, null, 2));
          console.log('✓ Generated releases.json');
          console.log(JSON.stringify(release, null, 2));
          EOF
          
          node generate-releases.js

      - name: Upload releases.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: releases-json
          path: updates/
          retention-days: 30

      - name: Upload to updater server
        if: success() && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Настройка SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          # Загрузка артефактов и releases.json
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            updates/ \
            $DEPLOY_USER@$DEPLOY_HOST:/var/www/updates/
          
          echo "✓ Uploaded to updater server"

  # Сборка веб-версии
  build-web:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_PB_URL: ${{ secrets.VITE_PB_URL }}

      - name: Deploy to web server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          SOURCE: "dist/"
          TARGET: "/var/www/weche/public"
