name: Tauri Release

# Упрощенный workflow только для релизов Tauri приложения
# Использовать когда нужно обновить только desktop версию

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например: 0.3.1)'
        required: true
        type: string
      draft:
        description: 'Создать как черновик'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Пометить как pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Update version in configs
        run: |
          VERSION="${{ inputs.version }}"
          
          # Обновляем tauri.conf.json
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            config.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(config, null, 2));
          "
          
          # Обновляем package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          
          echo "✓ Updated version to $VERSION"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: 'Вече v${{ inputs.version }}'
          releaseBody: |
            ## Что нового в версии ${{ inputs.version }}
            
            ### ✨ Новые возможности
            - [Опишите новые функции]
            
            ### 🐛 Исправления
            - [Опишите исправленные баги]
            
            ### 📦 Установка
            
            **macOS:**
            - Скачайте `.dmg` файл для вашей архитектуры (Apple Silicon или Intel)
            - Откройте и перетащите в Applications
            
            **Windows:**
            - Скачайте `.msi` установщик
            - Запустите и следуйте инструкциям
            
            **Linux:**
            - Скачайте `.AppImage` или `.deb` пакет
            - Для AppImage: `chmod +x` и запустите
            - Для deb: `sudo dpkg -i veche_*.deb`
            
            ---
            
            **Полный список изменений:** [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          includeUpdaterJson: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.sig
          retention-days: 90

  # Генерация releases.json для системы автообновлений
  generate-updater-metadata:
    needs: build-tauri
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate releases.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Создаем структуру директорий
          mkdir -p updates/releases
          
          # Копируем все релизные файлы
          echo "📦 Copying release files..."
          find artifacts -type f \( \
            -name "*.dmg" \
            -o -name "*.msi" \
            -o -name "*.exe" \
            -o -name "*.AppImage" \
            -o -name "*.deb" \
            -o -name "*.sig" \
          \) -exec cp -v {} updates/releases/ \;
          
          # Генерируем releases.json
          cat > generate-releases.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          const version = process.env.VERSION;
          const releasesDir = 'updates/releases';
          const files = fs.readdirSync(releasesDir);
          
          console.log('📋 Found files:', files);
          
          const platforms = {};
          
          // Маппинг файлов на платформы
          const platformMap = {
            'darwin-aarch64': { exts: ['.dmg'], contains: ['aarch64', 'arm64'] },
            'darwin-x86_64': { exts: ['.dmg'], excludes: ['aarch64', 'arm64'] },
            'windows-x86_64': { exts: ['.msi', '-setup.exe'] },
            'linux-x86_64': { exts: ['.AppImage'] }
          };
          
          files.forEach(file => {
            if (file.endsWith('.sig')) return;
            
            let detectedPlatform = '';
            
            for (const [platform, config] of Object.entries(platformMap)) {
              const hasExt = config.exts.some(ext => file.endsWith(ext));
              const hasContains = !config.contains || config.contains.some(s => file.includes(s));
              const hasExcludes = config.excludes && config.excludes.some(s => file.includes(s));
              
              if (hasExt && hasContains && !hasExcludes) {
                detectedPlatform = platform;
                break;
              }
            }
            
            if (detectedPlatform) {
              const sigFile = file + '.sig';
              const sigPath = path.join(releasesDir, sigFile);
              
              if (fs.existsSync(sigPath)) {
                const signature = fs.readFileSync(sigPath, 'utf-8').trim();
                platforms[detectedPlatform] = {
                  signature,
                  url: `https://updates.weche.ru/releases/${file}`
                };
                console.log(`✓ ${detectedPlatform}: ${file}`);
              } else {
                console.warn(`⚠ Missing signature for ${file}`);
              }
            }
          });
          
          const release = {
            version,
            notes: `Обновление до версии ${version}`,
            pub_date: new Date().toISOString(),
            platforms
          };
          
          console.log('\n📝 Generated release metadata:');
          console.log(JSON.stringify(release, null, 2));
          
          // Читаем или создаем releases.json
          let releases = [];
          const jsonPath = 'updates/releases.json';
          
          if (fs.existsSync(jsonPath)) {
            const existing = fs.readFileSync(jsonPath, 'utf-8');
            releases = JSON.parse(existing);
            console.log(`\n📚 Found ${releases.length} existing releases`);
          }
          
          // Удаляем старую версию если существует
          releases = releases.filter(r => r.version !== version);
          
          // Добавляем новый релиз в начало
          releases.unshift(release);
          
          // Сохраняем
          fs.writeFileSync(jsonPath, JSON.stringify(releases, null, 2));
          console.log(`\n✅ Saved releases.json with ${releases.length} releases`);
          SCRIPT
          
          node generate-releases.js

      - name: Upload updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: updater-metadata
          path: updates/
          retention-days: 90

      - name: Deploy to updater server
        if: success()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Настройка SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          
          # Загрузка на сервер
          echo "📤 Uploading to $DEPLOY_HOST..."
          rsync -avz --progress -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            updates/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/updates/"
          
          echo "✅ Deploy completed!"
          
          # Очистка
          rm ~/.ssh/deploy_key

      - name: Create summary
        if: always()
        run: |
          echo "## 🚀 Release v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (Intel & Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows (x64)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux (AppImage)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Auto-update" >> $GITHUB_STEP_SUMMARY
          echo "releases.json updated on updater server" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Updater Endpoint](https://updates.weche.ru/releases.json)" >> $GITHUB_STEP_SUMMARY
