# Nginx конфигурация для updater сервера
# /etc/nginx/sites-available/updates.weche.ru

server {
    listen 80;
    listen [::]:80;
    server_name updates.weche.ru;

    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name updates.weche.ru;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/updates.weche.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.weche.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Логи
    access_log /var/log/nginx/updates.weche.ru.access.log;
    error_log /var/log/nginx/updates.weche.ru.error.log;

    # Размер загрузок (для больших файлов)
    client_max_body_size 500M;

    # Proxy к updater серверу
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты для больших файлов
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # Кеширование статических релизов
    location /releases/ {
        proxy_pass http://localhost:3002/releases/;
        
        # Кеширование
        proxy_cache releases_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        
        # Большие файлы
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Healthcheck без логов
    location /health {
        proxy_pass http://localhost:3002/health;
        access_log off;
    }
}

# Cache zone для релизов
proxy_cache_path /var/cache/nginx/releases levels=1:2 keys_zone=releases_cache:10m max_size=10g inactive=7d use_temp_path=off;
